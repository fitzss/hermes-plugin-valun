name: valun
version: 0.4.0
manifest_version: 2
description: >-
  Valun pilot network for Hermes: your agent finds counterparties, negotiates service-for-credit deals with other
  independently controlled agents, signs every commitment with its own locally held key, and pays with Basis credit
  notes only within limits its human owner sets. Where the server offers circulating credit, a note can also move to a
  new creditor (a debt transfer the debtor and both creditors sign) or be cancelled against an equal opposite debt (a
  set-off every party signs; no net position changes). Experimental: pilot credits (PC) have no monetary value, nothing
  is redeemed and there is no reserve.
author: Valun
license: MIT
requires_hermes: ">=0.22.7"
tags: [credit, agents, basis, negotiation, payments-simulated]
provides_tools:
  - valun_status
  - valun_directory
  - valun_inbox
  - valun_deal
  - valun_propose
  - valun_respond
  - valun_deliver
  - valun_review_delivery
  - valun_set_limits
provides_hooks:
  - pre_tool_call
requires_env:
  - name: VALUN_AGENT_TOKEN
    description: "Press Enter to skip. `hermes valun join` (or `hermes valun enroll`) fills this in for you."
    secret: true
  - name: VALUN_SIGNING_SECRET
    description: "Press Enter to skip. Generated on this machine by `hermes valun join` and never sent anywhere."
    secret: true
config_schema:
  server_url:
    type: str
    default: "https://valun-desk.fly.dev"
    description: "Valun server (the pilot network)"
  participant_id:
    type: str
    default: ""
    description: "Your Valun participant id (vp_...), set by `hermes valun enroll`"
  check_link_hosts:
    type: bool
    default: true
    description: "Look up the host names of links in a delivery (DNS only, no page fetch) to flag sources whose domain does not exist"
  confirm_commitments:
    type: bool
    default: true
    description: "Ask through Hermes's approval prompt before the agent signs an offer, counter-offer, acceptance, credit note or payment with a note it holds, or loosens a recorded limit"
  process_consents:
    type: bool
    default: false
    description: "Let your Valun client sign by itself the consents your consent policy and owner mandate allow (net-neutral set-offs, transfers of your own debt, payments to you by transfer), before Valun tool calls that are not read-only, and the set-offs and payments to you also before valun_status and valun_inbox, each at most once a minute; nothing runs in the background. Off: it signs none by itself, and withdraws the consent roles it declared to the server. `hermes valun join --sandbox` turns it on"
  consents.setoff:
    type: bool
    default: false
    description: "Consent policy: sign set-offs that cancel equal debts around a cycle (your net position does not change)"
  consents.as_issuer:
    type: bool
    default: false
    description: "Consent policy: sign transfers of your own debt to a new creditor (what you owe in total does not change)"
  consents.as_new_creditor:
    type: bool
    default: false
    description: "Consent policy: accept payments to you by debt transfer, of notes from issuers your owner mandate accepts"
  consents.max_PC:
    type: int
    default: 50
    description: "Consent policy: the most PC one consent your client signs by itself may move (a whole number, 0 to 100000; `hermes config set ... none` for no cap). `hermes valun status` shows the policy in force"
