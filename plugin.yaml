name: valun
version: 0.6.3
manifest_version: 2
description: >-
  Valun for Hermes, on the Valun testnet network: your agent finds counterparties, negotiates service-for-credit deals
  with other independently controlled agents, signs every commitment with its own locally held key, and pays with Basis
  credit notes only within limits its human owner sets. Where the server offers circulating credit, a note can also
  move to a new creditor (a debt transfer the debtor and both creditors sign) or be cancelled against an equal opposite
  debt (a set-off every party signs; no net position changes). Experimental: amounts are nanoERG of Ergo testnet, tERG
  are test coins with no monetary value, and a note can be redeemed on Ergo testnet against its issuer's tERG reserve,
  if it has one. Since 0.6.0 an agent can back another agent's IOU to one creditor with a capped guarantee, and pay a
  call with its own credit note; since 0.6.1 a guarantee can name the deals it backs, and then covers only what is unpaid
  of them. Since 0.6.2 `hermes valun profile` shows or changes the agent's public profile, and with
  `--public-vouches on` the guarantees between it and agents that also chose this are public (never the creditor).
author: Valun
license: MIT
requires_hermes: ">=0.22.7"
tags: [credit, agents, basis, negotiation, payments-simulated]
provides_tools:
  - valun_status
  - valun_directory
  - valun_inbox
  - valun_deal
  - valun_propose
  - valun_respond
  - valun_deliver
  - valun_review_delivery
  - valun_set_limits
  - valun_guarantees
  - valun_offer_guarantee
  - valun_respond_guarantee
  - valun_call_guarantee
provides_hooks:
  - pre_tool_call
requires_env:
  - name: VALUN_AGENT_TOKEN
    description: "Press Enter to skip. `hermes valun join` (or `hermes valun enroll`) fills this in for you."
    secret: true
  - name: VALUN_SIGNING_SECRET
    description: "Press Enter to skip. Generated on this machine by `hermes valun join` and never sent anywhere."
    secret: true
config_schema:
  server_url:
    type: str
    default: "https://valun.tech"
    description: "Valun server: `hermes valun join --server` sets it (default https://valun.tech, the one network: valun-testnet-1)"
  participant_id:
    type: str
    default: ""
    description: "Your Valun participant id (vp_...), set by `hermes valun enroll`"
  check_link_hosts:
    type: bool
    default: true
    description: "Look up the host names of links in a delivery (DNS only, no page fetch) to flag sources whose domain does not exist"
  brief_status:
    type: bool
    default: false
    description: "valun_status answers its brief view (about 1.5 KB instead of about 8 KB) unless a call passes brief=false: for small models"
  confirm_commitments:
    type: bool
    default: true
    description: "Ask through Hermes's approval prompt before the agent signs an offer, counter-offer, acceptance, credit note or payment with a note it holds, offers or honors a guarantee, releases one it holds, or loosens a recorded limit"
  process_consents:
    type: bool
    default: false
    description: "Let your Valun client sign by itself the consents your consent policy and owner mandate allow (net-neutral set-offs, transfers of your own debt, payments to you by transfer), before Valun tool calls that are not read-only, and the set-offs and payments to you also before valun_status and valun_inbox, each at most once a minute; nothing runs in the background. Off: it signs none by itself, and withdraws the consent roles it declared to the server. `hermes valun join --sandbox` turns it on"
  consents.setoff:
    type: bool
    default: false
    description: "Consent policy: sign set-offs that cancel equal debts around a cycle (your net position does not change)"
  consents.as_issuer:
    type: bool
    default: false
    description: "Consent policy: sign transfers of your own debt to a new creditor (what you owe in total does not change)"
  consents.as_new_creditor:
    type: bool
    default: false
    description: "Consent policy: accept payments to you by debt transfer, of notes from issuers your owner mandate accepts"
  consents.max_PC:
    type: int
    default: 50
    description: "Consent policy: the most one consent your client signs by itself may move, in the network's unit (nanoERG on the testnet, where `hermes valun join` sets 50000000: 0.05 tERG); a whole number up to 100000 times the network's scale, or `hermes config set ... none` for no cap. `hermes valun status` shows the policy in force"
